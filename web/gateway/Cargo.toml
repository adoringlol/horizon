[package]
name = "horizon-web-gateway"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query", "socks"] }
tokio-socks = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
getrandom = "0.3"
base64 = "0.22"
percent-encoding = "2"

[dev-dependencies]
tokio-tungstenite = "0.29"
