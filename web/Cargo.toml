[package]
name = "horizon-web"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Independent workspace: browser builds don't resolve the native game, launcher,
# Wasmtime or platform drivers. The simulation/protocol sources stay shared.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
horizon-core = { path = "../crates/horizon-core" }
horizon-world = { path = "../crates/horizon-world" }
horizon-protocol = { path = "../crates/horizon-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
console_error_panic_hook = "0.1"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu", "wgsl"] }
web-sys = { version = "0.3.106", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement",
    "HtmlCanvasElement", "Storage", "Location", "Event", "EventTarget", "KeyboardEvent",
    "MouseEvent", "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "ErrorEvent",
    "Request", "RequestInit", "RequestMode", "Response", "Headers", "Performance", "Url", "console"
] }

[profile.release]
lto = "thin"
codegen-units = 1
