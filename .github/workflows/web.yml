name: browser port
on:
  push:
    branches: [web-port]
    paths: ['web/**', 'crates/horizon-core/**', 'crates/horizon-world/**', 'crates/horizon-protocol/**', 'crates/horizon-client/src/player_sync.rs', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and browser target
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Format and test browser connection core
        working-directory: web
        run: |
          cargo fmt --check
          cargo test --locked --lib
          cargo clippy --locked --lib -- -D warnings
          cargo clippy --locked --target wasm32-unknown-unknown --lib -- -D warnings
      - name: Test gateway and proxy routing
        working-directory: web/gateway
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build deployable browser bundle
        working-directory: web
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          cargo build --locked --release --target wasm32-unknown-unknown --lib
          wasm-bindgen target/wasm32-unknown-unknown/release/horizon_web.wasm --target web --out-dir public/pkg
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-web
          path: web/public
